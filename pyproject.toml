[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "starsky-gen"
version = "1.0.0"
description = "Cinematic AAA skybox and starfield generator for games"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "starsky-gen contributors" }
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "Pillow>=10.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
starsky-gen = "starsky_gen.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Keep the CI gate focused; expand gradually. Format is not gated yet.
select = ["F"]
